services:
  postgres:
    image: postgres:16-alpine
    container_name: minisonhos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minisonhos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minisonhos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-minisonhos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minisonhos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: minisonhos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@minisonhos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
